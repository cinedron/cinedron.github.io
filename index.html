<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="Cinedron 작업용 웹 계산기 모음">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
  <title>Cinedron 도구</title>
  <link rel="stylesheet" href="/site.css">
  <script src="/site.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Cinedron 도구</h1>
      <p>사용할 웹프로그램을 선택하세요.</p>
    </header>

    <section class="app-list" aria-label="웹프로그램 목록">
      <a class="app-button" href="/apps/cinespider/">
        <img src="/apps/cinespider/icons/Icon-192.png" alt="" width="72" height="72">
        <span class="app-text">
          <strong>시네스파이더 계산기</strong>
          <small>좌표 변환 및 회전 계산</small>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>

      <a class="app-button" href="/apps/cinespider-install/">
        <span class="app-icon app-icon--install" aria-hidden="true">
          <span></span>
        </span>
        <span class="app-text">
          <strong>시네스파이더 설치 계산기</strong>
          <small>와이어 길이 및 운용 공간 참고</small>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>

      <a class="app-button" href="/apps/winch-drum/">
        <span class="app-icon app-icon--drum" aria-hidden="true">
          <span></span>
        </span>
        <span class="app-text">
          <strong>윈치 드럼 용량 계산기</strong>
          <small>단층 권취량·필요 폭·플리트 각도 확인</small>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>
    </section>
  </main>
</body>
</html>
